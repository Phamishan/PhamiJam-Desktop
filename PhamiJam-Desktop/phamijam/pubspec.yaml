name: phamijam
description: "A new Flutter project."
publish_to: "none"
version: 1.1.5+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  google_sign_in_all_platforms: ^2.0.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.0.0
  audio_video_progress_bar: ^2.0.3
  marquee: ^2.3.0
  http: ^1.4.0
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  audio_metadata_reader: ^1.4.2
  file_picker: ^11.0.2
  dart_discord_presence: ^1.2.0
  youtube_explode_dart:
    git:
      url: https://github.com/elias001011/youtube_explode_dart.git
      ref: 86cd5a97b6bad4e4907d04d8c167ab3b6ad943b0
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  ytmusicapi_dart: ^2.3.0
  another_flushbar: ^1.12.32
  flutter_context_menu: ^0.4.2
  webview_windows: ^0.4.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  win32: ^5.15.0
  ffi: ^2.2.0
  win32_registry: ^2.1.0
  windows_taskbar: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  google_sign_in_all_platforms_desktop:
    path: packages/google_sign_in_all_platforms_desktop

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/taskbar/
    - assets/CHANGELOG.md
    - .env
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
