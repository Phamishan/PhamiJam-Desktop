name: phamijam
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ^3.10.8

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8
    google_sign_in_all_platforms: ^2.0.2
    firebase_core: ^4.4.0
    firebase_auth: ^6.1.4
    audio_video_progress_bar: ^2.0.3
    marquee: ^2.3.0
    http: ^1.4.0
    flutter_dotenv: ^6.0.0
    provider: ^6.1.5+1
    audio_metadata_reader: ^1.4.2
    file_picker: ^8.1.7
    youtube_explode_dart: ^2.5.2
    media_kit: ^1.1.11
    media_kit_video: ^1.2.5
    media_kit_libs_windows_video: ^1.0.11
    ytmusicapi_dart: ^2.3.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/images/
        - .env
    fonts:
        - family: Lexend
          fonts:
              - asset: assets/fonts/Lexend-Regular.ttf
