name: Build & Release Windows Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: PhamiJam-Desktop/phamijam
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore .env
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes(".env", [System.Convert]::FromBase64String("${{ secrets.PHAMIJAM_ENV_FILE_B64 }}"))

      - name: Restore firebase_options.dart
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("lib/firebase_options.dart", [System.Convert]::FromBase64String("${{ secrets.PHAMIJAM_FIREBASE_OPTIONS_B64 }}"))

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\phamijam_desktop_script.iss'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: PhamiJam-Desktop/phamijam/installers/phamijam_setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
